<!-- Dark mode toggle script -->
<script>
(function() {
  var body = document.body;
  var toggle = document.getElementById('theme-toggle');
  if (!toggle) return;

  var moonIcon = toggle.querySelector('.theme-icon--moon');
  var sunIcon = toggle.querySelector('.theme-icon--sun');

  function setIcons(isDark) {
    if (moonIcon && sunIcon) {
      moonIcon.style.display = isDark ? 'none' : 'block';
      sunIcon.style.display = isDark ? 'block' : 'none';
    }
  }

  // Apply saved or system preference
  var saved = localStorage.getItem('theme');
  if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    body.classList.add('dark-mode');
    setIcons(true);
  } else {
    setIcons(false);
  }

  // Remove the pending class from html
  document.documentElement.classList.remove('dark-mode-pending');

  // Toggle handler
  toggle.addEventListener('click', function() {
    body.classList.toggle('dark-mode');
    var isDark = body.classList.contains('dark-mode');
    setIcons(isDark);
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  });

  // Listen for system theme changes (if user hasn't set preference)
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
    if (!localStorage.getItem('theme')) {
      var isDark = e.matches;
      body.classList.toggle('dark-mode', isDark);
      setIcons(isDark);
    }
  });
})();
</script>
